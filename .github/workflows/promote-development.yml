name: Propose development for production

on:
  push:
    branches:
      - development

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: development-to-production-pr
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Open pull request when development is ahead
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          has_changes=$(gh api "repos/$GH_REPO/compare/production...development" \
            --jq '(.ahead_by > 0) and ((.files | length) > 0)')
          if [ "$has_changes" != "true" ]; then
            echo "development has no changes to promote"
            exit 0
          fi

          existing=$(gh api -X GET "repos/$GH_REPO/pulls" \
            -f state=open \
            -f base=production \
            -f head="${GITHUB_REPOSITORY_OWNER}:development" \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Pull request #$existing already tracks development into production"
            exit 0
          fi

          gh pr create \
            --repo "$GH_REPO" \
            --base production \
            --head development \
            --title "Promote development to production" \
            --body "Automatically proposed after development advanced. Review the changes and required checks before merging into production."
