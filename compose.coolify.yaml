          "bind": { "create_host_path": false },
          "read_only": true,
          "source": "./infra/supabase/volumes/functions",
          "target": "/app/edge-functions",
          "type": "bind",
        },
      ]
    networks:
      backend: {}
  supavisor:
    command:
      [
        "/bin/sh",
        "-c",
        '/app/bin/migrate && /app/bin/supavisor eval "$$(cat /etc/pooler/pooler.exs)" && /app/bin/server',
      ]
    depends_on:
      db:
        condition: "service_healthy"
        required: true
    environment:
      API_JWT_SECRET: "${JWT_SECRET:?}"
      CLUSTER_POSTGRES: "true"
      DATABASE_URL: "ecto://supabase_admin:${POSTGRES_PASSWORD:?}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/_supabase"
      DB_POOL_SIZE: "${POOLER_DB_POOL_SIZE:-5}"
      ERL_AFLAGS: "-proto_dist inet_tcp"
      METRICS_JWT_SECRET: "${JWT_SECRET:?}"
      POOLER_DEFAULT_POOL_SIZE: "${POOLER_DEFAULT_POOL_SIZE:-20}"
      POOLER_MAX_CLIENT_CONN: "${POOLER_MAX_CLIENT_CONN:-100}"
      POOLER_POOL_MODE: "transaction"
      POOLER_TENANT_ID: "${POOLER_TENANT_ID:-campusmarkt}"
      PORT: 4000
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
      POSTGRES_HOST: "${POSTGRES_HOST:-db}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      REGION: "local"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?}"
      VAULT_ENC_KEY: "${VAULT_ENC_KEY:?}"
    healthcheck:
      interval: "10s"
      retries: 10
      start_period: "30s"
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "http://127.0.0.1:4000/api/health",
        ]
      timeout: "5s"
    image: "supabase/supavisor:2.9.12"
    restart: "unless-stopped"
    volumes:
      [
        {
          "bind": { "create_host_path": false },
          "read_only": true,
          "source": "./infra/supabase/volumes/pooler/pooler.exs",
          "target": "/etc/pooler/pooler.exs",
          "type": "bind",
        },
      ]
    networks:
      backend: {}
  web:
    build:
      context: "."
      dockerfile: "apps/web/Dockerfile"
    depends_on:
      api-gw:
        condition: "service_healthy"
        required: true
      migration-gate:
        condition: "service_completed_successfully"
        required: true
    environment:
      CURRENT_PRIVACY_VERSION: "${CURRENT_PRIVACY_VERSION:-privacy-2026-09}"
      CURRENT_TERMS_VERSION: "${CURRENT_TERMS_VERSION:-terms-2026-09}"
      IDENTITY_ACTION_BASE_URL: "${IDENTITY_ACTION_BASE_URL:-http://localhost:8080}"
      IDENTITY_HASH_PEPPER: "${IDENTITY_HASH_PEPPER:?}"
      SMTP_ADMIN_EMAIL: "${SMTP_ADMIN_EMAIL:?}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PASS: "${SMTP_PASS:?}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_SENDER_NAME: "${SMTP_SENDER_NAME:-CampusMarkt}"
      SMTP_TLS_MODE: "${SMTP_TLS_MODE:-implicit}"
      SMTP_USER: "${SMTP_USER:?}"
      SUPABASE_PUBLISHABLE_KEY: "${ANON_KEY:?}"
      SUPABASE_SERVICE_ROLE_KEY: "${SERVICE_ROLE_KEY:?}"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?}"
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:?}"
      PORT: "3000"
      PUBLIC_CONTACT_EMAIL: "${PUBLIC_CONTACT_EMAIL:-kontakt@campusmarkt.local}"
      PUBLIC_PRIVACY_EMAIL: "${PUBLIC_PRIVACY_EMAIL:-datenschutz@campusmarkt.local}"
      SUPABASE_HEALTH_KEY: "${ANON_KEY:?}"
      SUPABASE_INTERNAL_URL: "http://api-gw:8000"
      SMTP_FROM: "${SMTP_SENDER_NAME:-CampusMarkt} <${SMTP_ADMIN_EMAIL:?}>"
    expose: ["3000"]
    healthcheck:
      interval: "10s"
      retries: 5
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      timeout: "5s"
    image: "campusmarkt/web:${STACK_ID:?}"
    restart: "unless-stopped"
    networks:
      backend: {}
  minio:
    image: "cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b"
    restart: "unless-stopped"
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-campusmarkt-storage}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?}"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: "5s"
      timeout: "10s"
      retries: 6
      start_period: "30s"
    networks:
      backend: {}
    volumes: [{ "type": "volume", "source": "minio-data", "target": "/data" }]
  minio-createbucket:
    image: "cgr.dev/chainguard/minio-client@sha256:f99f0052305eefdc41a40cb7ac555734566e47e06871360eb28997e5c24d8e16"
    restart: "no"
    networks:
      backend: {}
    depends_on:
      minio:
        condition: "service_healthy"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-campusmarkt-storage}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?}"
      GLOBAL_S3_BUCKET: "${GLOBAL_S3_BUCKET:-campusmarkt}"
    entrypoint:
      [
        "/bin/sh",
        "-ec",
        'mc alias set internal http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null && mc mb --ignore-existing "internal/$$GLOBAL_S3_BUCKET"',
      ]
volumes:
  caddy-config:
    name: "${STACK_ID:?}-caddy-config"
  caddy-data:
    name: "${STACK_ID:?}-caddy-data"
  campusmarkt-postgres-data:
    name: "${STACK_ID:?}-campusmarkt-postgres-data"
  campusmarkt-storage-data:
    name: "${STACK_ID:?}-campusmarkt-storage-data"
  db-config:
    name: "${STACK_ID:?}-db-config"
  deno-cache:
    name: "${STACK_ID:?}-deno-cache"
  minio-data:
    name: "${STACK_ID:?}-minio-data"
  studio-snippets:
    name: "${STACK_ID:?}-studio-snippets"
x-migration-service:
  depends_on:
    auth:
      condition: "service_healthy"
    db:
      condition: "service_healthy"
    storage:
      condition: "service_healthy"
  entrypoint: ["/bin/sh", "/app/apply-migrations.sh"]
  environment:
    MIGRATIONS_DIRECTORY: "/app/migrations"
    PGDATABASE: "${POSTGRES_DB:-postgres}"
    PGHOST: "db"
    PGPASSWORD: "${POSTGRES_PASSWORD:?}"
    PGPORT: "${POSTGRES_PORT:-5432}"
    PGUSER: "postgres"
  image: "supabase/postgres:17.6.1.136"
  restart: "no"
  volumes:
    [
      "./supabase/migrations:/app/migrations:ro",
      "./supabase/apply-migrations.sh:/app/apply-migrations.sh:ro",
    ]
