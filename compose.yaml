name: campusmarkt

x-migration-service: &migration-service
  image: supabase/postgres:17.6.1.136
  restart: "no"
  depends_on:
    db:
      condition: service_healthy
  environment:
    PGHOST: db
    PGPORT: ${POSTGRES_PORT:-5432}
    PGDATABASE: ${POSTGRES_DB:-postgres}
    PGUSER: postgres
    PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    MIGRATIONS_DIRECTORY: /app/migrations
  volumes:
    - ./supabase/migrations:/app/migrations:ro
    - ./supabase/apply-migrations.sh:/app/apply-migrations.sh:ro
  entrypoint: ["/bin/sh", "/app/apply-migrations.sh"]

include:
  - path:
      - ./infra/supabase/docker-compose.yml
      - ./infra/compose/supabase.override.yaml

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api-gw:
        condition: service_healthy
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
    ports:
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  web:
    image: campusmarkt/web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api-gw:
        condition: service_healthy
      migration-gate:
        condition: service_completed_successfully
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL is required}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_INTERNAL_URL: http://api-gw:8000
      SUPABASE_HEALTH_KEY: ${ANON_KEY:?ANON_KEY is required}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  migration-gate:
    <<: *migration-service

  migration:
    <<: *migration-service
    profiles: ["operations"]

networks:
  default:
    name: campusmarkt-platform

volumes:
  caddy-data:
  caddy-config:
