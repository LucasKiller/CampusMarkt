services:
  caddy:
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS is required for production HTTPS}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"

  storage:
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-file}
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-}
      GLOBAL_S3_ENDPOINT: ${GLOBAL_S3_ENDPOINT:-}
      GLOBAL_S3_PROTOCOL: ${GLOBAL_S3_PROTOCOL:-https}
      GLOBAL_S3_FORCE_PATH_STYLE: ${GLOBAL_S3_FORCE_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      REGION: ${REGION:-}

  web:
    environment:
      IDENTITY_HASH_PEPPER: ${IDENTITY_HASH_PEPPER:?IDENTITY_HASH_PEPPER is required for production}
      IDENTITY_ACTION_BASE_URL: ${IDENTITY_ACTION_BASE_URL:?IDENTITY_ACTION_BASE_URL is required for production}
      CURRENT_TERMS_VERSION: ${CURRENT_TERMS_VERSION:?CURRENT_TERMS_VERSION is required for production}
      CURRENT_PRIVACY_VERSION: ${CURRENT_PRIVACY_VERSION:?CURRENT_PRIVACY_VERSION is required for production}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required for production}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required for production}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required for production}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required for production}
      SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:?SMTP_ADMIN_EMAIL is required for production}
      PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:?PUBLIC_CONTACT_EMAIL is required for production}
      PUBLIC_PRIVACY_EMAIL: ${PUBLIC_PRIVACY_EMAIL:?PUBLIC_PRIVACY_EMAIL is required for production}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-implicit}
