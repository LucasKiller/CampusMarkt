services:
  api-gw:
    ports: !reset []

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - campusmarkt-postgres-data:/var/lib/postgresql/data

  supavisor:
    ports: !reset []

  storage:
    healthcheck:
      # Cold volumes can require migrations before the Storage status route responds.
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 45s
      start_interval: 5s
    volumes:
      - campusmarkt-storage-data:/var/lib/storage

  imgproxy:
    volumes:
      - campusmarkt-storage-data:/var/lib/storage

volumes:
  campusmarkt-postgres-data:
  campusmarkt-storage-data:
